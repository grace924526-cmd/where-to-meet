<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💥 下班顺路吃什么！</title>
  <link rel="stylesheet" href="/static/css/comic-ui.css" />
  <style>
    /* ── 布局骨架 ── */
    body { min-height: 100vh; }

    .app-header {
      background-color: var(--k-yellow);
      border-bottom: var(--k-stroke);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .app-header h1 {
      font-size: 36px;
      margin: 0;
      text-shadow: 3px 3px 0px #777;
    }

    .app-body {
      display: flex;
      height: calc(100vh - 80px);
    }

    /* 左侧面板：输入区 + 结果区 */
    .panel-left {
      width: 420px;
      min-width: 280px;
      max-width: 600px;
      border-right: var(--k-stroke);
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 右侧面板：地图 */
    .panel-right {
      flex: 1;
      position: relative;
    }
    #map-container {
      width: 100%;
      height: 100%;
      border: 4px solid var(--k-ink); /* 漫画框 */
      background: #1a1a2e; /* 地图加载前的底色 */
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: 'Bangers', cursive;
      font-size: 24px;
    }

    /* 拖拽分界线 */
    .divider {
      width: 8px;
      cursor: col-resize;
      background: var(--k-ink);
      flex-shrink: 0;
    }
    .divider:hover { background: var(--k-red); }

    /* ── 输入卡片 ── */
    .location-card { position: relative; }
    .location-card .card-label {
      position: absolute;
      top: -14px; left: 16px;
      background: var(--k-yellow);
      border: 2px solid var(--k-ink);
      font-family: 'Bangers', cursive;
      font-size: 18px;
      padding: 2px 10px;
      letter-spacing: 1px;
    }
    .location-card.b-card .card-label { background: var(--k-blue); color: var(--k-white); }

    .input-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .input-row label { font-size: 14px; color: #555; font-family: 'Comic Neue', cursive; }
    .input-row .k-input { margin-bottom: 0; }

    /* 自定义下拉候选框（KABOOM! 风格手写） */
    .suggest-wrap { position: relative; }
    .suggest-list {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 999;
      background: var(--k-white);
      border: var(--k-stroke);
      box-shadow: var(--k-shadow);
      max-height: 200px; overflow-y: auto;
      display: none;
    }
    .suggest-list.open { display: block; }
    .suggest-item {
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 2px dashed var(--k-ink);
      font-size: 15px;
    }
    .suggest-item:hover { background: var(--k-yellow); }

    /* ── 需求输入 ── */
    .query-section { }
    .query-section textarea.k-input {
      resize: vertical;
      min-height: 80px;
      margin-bottom: 0;
    }

    /* 出行方式选择 */
    .travel-mode {
      display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px;
    }
    .mode-btn {
      padding: 6px 12px;
      border: 2px solid var(--k-ink);
      background: var(--k-white);
      cursor: pointer;
      font-family: 'Comic Neue', cursive;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.1s;
    }
    .mode-btn.active { background: var(--k-blue); color: var(--k-white); }
    .mode-btn:hover { background: var(--k-yellow); color: var(--k-ink); }

    /* ── 加载状态（手写 KABOOM! 风格） ── */
    .loading-bar {
      display: none;
      text-align: center;
      padding: 16px;
    }
    .loading-bar.show { display: block; }
    .loading-dots span {
      display: inline-block;
      width: 12px; height: 12px;
      background: var(--k-ink);
      border-radius: 50%;
      margin: 0 4px;
      animation: bounce 0.8s infinite alternate;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-12px); } }

    /* ── 结果卡片 ── */
    .results-section { display: none; }
    .results-section.show { display: block; }
    .result-card {
      margin-bottom: 12px;
      padding: 16px 18px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .result-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--k-ink);
    }
    .result-card.selected {
      border-color: var(--k-red);
      box-shadow: 5px 5px 0px var(--k-red);
    }
    .result-card:focus-visible {
      outline: 3px solid var(--k-blue);
      outline-offset: 3px;
    }

    .result-card .result-name {
      min-width: 0;
      overflow-wrap: anywhere;
      font-family: 'Bangers', cursive;
      font-size: 21px;
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .result-card .result-address {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      font-size: 13px;
      line-height: 1.4;
      color: #555;
      margin-bottom: 8px;
      overflow-wrap: anywhere;
    }
    .result-card .result-meta {
      display: flex;
      gap: 8px 12px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .result-card .route-row {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      font-size: 14px;
      margin-top: 6px;
    }
    .result-card .route-col {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border: 2px dashed var(--k-ink);
      background: #fffdf0;
    }
    .result-card .route-col strong {
      font-family: 'Bangers', cursive;
      font-size: 16px;
    }
    .result-card .route-col small {
      display: inline-block;
      line-height: 1.35;
      margin-top: 2px;
    }
    .detour-badge {
      font-size: 14px;
      padding: 2px 8px;
      margin-bottom: 6px;
    }
    @media (max-width: 380px) {
      .result-card { padding: 14px 12px; }
      .result-card .route-row { gap: 6px; }
      .result-card .route-col { padding: 7px 6px; }
    }

    /* 顺路标签 */
    .detour-badge {
      display: inline-block;
      font-family: 'Bangers', cursive;
      font-size: 16px;
      padding: 2px 10px;
      border: 2px solid var(--k-ink);
      box-shadow: 2px 2px 0 var(--k-ink);
      margin-bottom: 8px;
    }
    .detour-badge.both  { background: var(--k-green); }
    .detour-badge.one   { background: var(--k-yellow); }
    .detour-badge.none  { background: #ddd; }

    /* 中间点推荐分区 */
    .midpoint-section { margin-top: 16px; }
    .midpoint-section .section-title {
      font-family: 'Bangers', cursive; font-size: 20px;
      border-bottom: var(--k-stroke); padding-bottom: 6px; margin-bottom: 12px;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .app-body { flex-direction: column; }
      .panel-left { width: 100%; max-width: 100%; border-right: none; border-bottom: var(--k-stroke); height: 60vh; }
      .panel-right { height: 40vh; }
      .divider { display: none; }
    }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header class="app-header">
    <h1>💥 下班顺路吃什么！</h1>
    <span class="k-badge" style="transform:rotate(3deg); font-size:14px;">BETA</span>
  </header>

  <!-- ── 主体 ── -->
  <div class="app-body">

    <!-- 左侧面板 -->
    <div class="panel-left" id="panel-left">

      <!-- A 的信息 -->
      <div class="k-card location-card" style="margin-top: 14px;">
        <span class="card-label">👤 人员 A</span>
        <div class="input-row" style="margin-top: 8px;">
          <label>下班地点</label>
          <div class="suggest-wrap">
            <input class="k-input" id="a-work-input" placeholder="搜索公司地址..." autocomplete="off" />
            <div class="suggest-list" id="a-work-suggest"></div>
          </div>
        </div>
        <div class="input-row">
          <label>回家地点</label>
          <div class="suggest-wrap">
            <input class="k-input" id="a-home-input" placeholder="搜索家庭住址..." autocomplete="off" />
            <div class="suggest-list" id="a-home-suggest"></div>
          </div>
        </div>
        <div>
          <label style="font-size:14px; color:#555;">出行方式</label>
          <div class="travel-mode" id="a-travel-mode">
            <button type="button" class="mode-btn active" data-mode="auto">⚡ 最快</button>
            <button type="button" class="mode-btn" data-mode="transit">🚇 地铁公交</button>
            <button type="button" class="mode-btn" data-mode="cycling">🚲 骑行</button>
            <button type="button" class="mode-btn" data-mode="driving">🚗 驾车</button>
            <button type="button" class="mode-btn" data-mode="walking">🚶 步行</button>
          </div>
        </div>
      </div>

      <!-- B 的信息 -->
      <div class="k-card location-card b-card" style="margin-top: 14px;">
        <span class="card-label">👤 人员 B</span>
        <div class="input-row" style="margin-top: 8px;">
          <label>下班地点</label>
          <div class="suggest-wrap">
            <input class="k-input" id="b-work-input" placeholder="搜索公司地址..." autocomplete="off" />
            <div class="suggest-list" id="b-work-suggest"></div>
          </div>
        </div>
        <div class="input-row">
          <label>回家地点</label>
          <div class="suggest-wrap">
            <input class="k-input" id="b-home-input" placeholder="搜索家庭住址..." autocomplete="off" />
            <div class="suggest-list" id="b-home-suggest"></div>
          </div>
        </div>
        <div>
          <label style="font-size:14px; color:#555;">出行方式</label>
          <div class="travel-mode" id="b-travel-mode">
            <button type="button" class="mode-btn active" data-mode="auto">⚡ 最快</button>
            <button type="button" class="mode-btn" data-mode="transit">🚇 地铁公交</button>
            <button type="button" class="mode-btn" data-mode="cycling">🚲 骑行</button>
            <button type="button" class="mode-btn" data-mode="driving">🚗 驾车</button>
            <button type="button" class="mode-btn" data-mode="walking">🚶 步行</button>
          </div>
        </div>
      </div>

      <!-- 需求描述 -->
      <div class="k-card query-section">
        <h3 style="font-size:18px; margin-bottom:8px;">🍜 想吃什么？</h3>
        <textarea class="k-input" id="query-input" placeholder="例：找一家安静的日料，不要太贵，两边路上时间差不多..."></textarea>
        <input class="k-input" id="city-input" placeholder="城市（如：北京）" style="margin-top:8px;" />
        <input class="k-input" id="departure-time" placeholder="出发时间（如：20:00，可选）" style="margin-top:4px;" />
        <button type="button" class="k-btn full" id="search-btn" style="margin-top:12px; font-size:20px;">
          💥 出发！找饭店！
        </button>
      </div>

      <!-- 加载中 -->
      <div class="loading-bar" id="loading-bar">
        <div class="loading-dots">
          <span></span><span></span><span></span>
        </div>
        <p id="loading-text" style="font-family:'Bangers',cursive; font-size:20px; margin-top:8px; transition: all 0.3s;">正在计算顺路方案...</p>
      </div>

      <!-- 结果区 -->
      <div class="results-section" id="results-section">
        <h3 id="results-title" style="font-family:'Bangers',cursive; font-size:22px; margin-bottom:12px;">🎯 顺路推荐</h3>
        <div id="results-list"></div>

        <!-- 中间点 fallback 区 -->
        <div class="midpoint-section" id="midpoint-section" style="display:none;">
          <div class="section-title">📍 中间点推荐（无顺路结果）</div>
          <div id="midpoint-list"></div>
        </div>

        <!-- 路线重算 -->
        <div class="k-card" id="recalc-panel" style="margin-top:16px; display:none;">
          <h3 style="font-size:16px; margin-bottom:10px;">🔄 切换出行方式重算</h3>
          <div>
            <label style="font-size:13px;">A 的出行方式</label>
            <div class="travel-mode" id="a-recalc-mode">
              <button type="button" class="mode-btn active" data-mode="auto">⚡</button>
              <button type="button" class="mode-btn" data-mode="transit">🚇</button>
              <button type="button" class="mode-btn" data-mode="cycling">🚲</button>
              <button type="button" class="mode-btn" data-mode="driving">🚗</button>
              <button type="button" class="mode-btn" data-mode="walking">🚶</button>
            </div>
          </div>
          <div style="margin-top:8px;">
            <label style="font-size:13px;">B 的出行方式</label>
            <div class="travel-mode" id="b-recalc-mode">
              <button type="button" class="mode-btn active" data-mode="auto">⚡</button>
              <button type="button" class="mode-btn" data-mode="transit">🚇</button>
              <button type="button" class="mode-btn" data-mode="cycling">🚲</button>
              <button type="button" class="mode-btn" data-mode="driving">🚗</button>
              <button type="button" class="mode-btn" data-mode="walking">🚶</button>
            </div>
          </div>
          <button type="button" class="k-btn blue full" id="recalc-btn" style="margin-top:12px; font-size:16px;">重新计算路线</button>
        </div>
      </div>

    </div><!-- /panel-left -->

    <!-- 拖拽分界线 -->
    <div class="divider" id="divider"></div>

    <!-- 右侧地图 -->
    <div class="panel-right">
      <div id="map-container">
        <span>地图加载中...</span>
      </div>
    </div>

  </div><!-- /app-body -->

  <script>
    // ══════════════════════════════════════════════
    // 状态
    // ══════════════════════════════════════════════
    const state = {
      a_work: null, a_home: null,
      b_work: null, b_home: null,
      prefer_a: 'auto', prefer_b: 'auto',
      session_id: null,
      map: null,
      markers: [],       // AMap.Marker 实例列表
      infoWindow: null,  // 当前打开的信息窗
    };

    // ══════════════════════════════════════════════
    // 输入校验 ── 按钮联动
    // ══════════════════════════════════════════════
    function refreshSearchBtn() {
      const btn = document.getElementById('search-btn');
      const missing = [];
      if (!state.a_work) missing.push('A 下班地点');
      if (!state.a_home) missing.push('A 回家地点');
      if (!state.b_work) missing.push('B 下班地点');
      if (!state.b_home) missing.push('B 回家地点');

      if (missing.length === 0) {
        btn.disabled = false;
        btn.style.opacity = '';
        btn.title = '';
      } else {
        btn.disabled = true;
        btn.style.opacity = '0.45';
        btn.title = '请先从联想列表选择：' + missing.join('、');
      }
    }

    // ══════════════════════════════════════════════
    // 高德地图初始化
    // ══════════════════════════════════════════════
    async function initMap() {
      const res = await fetch('/api/config');
      const cfg = await res.json();
      const jsKey = cfg.amap_js_key;
      const secKey = cfg.amap_js_security_key;
      if (!jsKey) { document.getElementById('map-container').textContent = '⚠️ 未配置 AMAP_JS_KEY'; return; }

      // 安全码注入（JS API 2.0 要求）
      window._AMapSecurityConfig = { securityJsCode: secKey || '' };

      const script = document.createElement('script');
      script.src = `https://webapi.amap.com/maps?v=2.0&key=${jsKey}&callback=onMapLoad`;
      document.head.appendChild(script);
    }

    window.onMapLoad = function() {
      state.map = new AMap.Map('map-container', {
        zoom: 12,
        center: [116.397, 39.909],
        mapStyle: 'amap://styles/dark',
      });
      state.infoWindow = new AMap.InfoWindow({ offset: new AMap.Pixel(0, -30) });
    };

    // ══════════════════════════════════════════════
    // 地址搜索联想
    // ══════════════════════════════════════════════
    function bindSuggest(inputId, suggestId, stateKey) {
      const input   = document.getElementById(inputId);
      const suggest = document.getElementById(suggestId);
      let debounceTimer;

      input.addEventListener('input', () => {
        // 用户手动改输入 → 清除已选地址
        state[stateKey] = null;
        refreshSearchBtn();

        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(async () => {
          const kw = input.value.trim();
          if (!kw) { suggest.classList.remove('open'); return; }
          const city = document.getElementById('city-input').value || '';
          const res  = await fetch('/api/geocode-suggest', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ keywords: kw, city })
          });
          const data = await res.json();
          const tips = data.tips || [];
          suggest.innerHTML = tips.slice(0, 6).map(t => `
            <div class="suggest-item" data-lng="${t.location?.split(',')[0] || ''}" data-lat="${t.location?.split(',')[1] || ''}" data-name="${t.name}">
              ${t.name} <small style="color:#888;">${t.district || ''}</small>
            </div>
          `).join('');
          suggest.classList.toggle('open', tips.length > 0);
        }, 300);
      });

      suggest.addEventListener('click', e => {
        const item = e.target.closest('.suggest-item');
        if (!item) return;
        const lng = parseFloat(item.dataset.lng);
        const lat = parseFloat(item.dataset.lat);
        const name = item.dataset.name;
        if (lng && lat) {
          state[stateKey] = { lng, lat, name };
          input.value = name;
          input.style.borderColor = 'var(--k-green)'; // 已选中视觉反馈
          refreshSearchBtn();
        }
        suggest.classList.remove('open');
      });

      document.addEventListener('click', e => {
        if (!input.contains(e.target) && !suggest.contains(e.target))
          suggest.classList.remove('open');
      });
    }

    bindSuggest('a-work-input', 'a-work-suggest', 'a_work');
    bindSuggest('a-home-input', 'a-home-suggest', 'a_home');
    bindSuggest('b-work-input', 'b-work-suggest', 'b_work');
    bindSuggest('b-home-input', 'b-home-suggest', 'b_home');

    // 初始化时禁用按钮
    refreshSearchBtn();

    // ══════════════════════════════════════════════
    // 出行方式切换
    // ══════════════════════════════════════════════
    function bindTravelMode(groupId, stateKey) {
      const group = document.getElementById(groupId);
      group.addEventListener('click', e => {
        const btn = e.target.closest('.mode-btn');
        if (!btn) return;
        group.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state[stateKey] = btn.dataset.mode;
      });
    }

    bindTravelMode('a-travel-mode', 'prefer_a');
    bindTravelMode('b-travel-mode', 'prefer_b');
    bindTravelMode('a-recalc-mode', 'prefer_a');
    bindTravelMode('b-recalc-mode', 'prefer_b');

    // ══════════════════════════════════════════════
    // Loading 动态文案 + 超时提示
    // ══════════════════════════════════════════════
    const LOADING_MSGS = [
      '正在计算双方的基准路线…',
      'AI 正在筛选候选地点…',
      '正在计算各候选的绕路时间…',
      '综合评分排序中…',
      'AI 正在生成推荐语…',
    ];
    let loadingTimer = null;
    let loadingMsgTimer = null;

    function showLoading() {
      const bar = document.getElementById('loading-bar');
      const txt = document.getElementById('loading-text');
      bar.classList.add('show');
      let idx = 0;
      txt.textContent = LOADING_MSGS[0];
      loadingMsgTimer = setInterval(() => {
        idx = (idx + 1) % LOADING_MSGS.length;
        txt.textContent = LOADING_MSGS[idx];
      }, 8000);
      // 30 秒超时提示
      loadingTimer = setTimeout(() => {
        txt.textContent = '还在努力计算中，请稍候 🔧';
      }, 30000);
    }

    function hideLoading() {
      document.getElementById('loading-bar').classList.remove('show');
      clearInterval(loadingMsgTimer);
      clearTimeout(loadingTimer);
    }

    // ══════════════════════════════════════════════
    // 搜索
    // ══════════════════════════════════════════════
    document.getElementById('search-btn').addEventListener('click', async () => {
      const { a_work, a_home, b_work, b_home } = state;
      if (!a_work || !a_home || !b_work || !b_home) return; // 按钮已禁用，双重保险

      showLoading();
      document.getElementById('results-section').classList.remove('show');

      const body = {
        location_a_work: a_work, location_a_home: a_home,
        location_b_work: b_work, location_b_home: b_home,
        query:           document.getElementById('query-input').value,
        city:            document.getElementById('city-input').value,
        prefer_a:        state.prefer_a,
        prefer_b:        state.prefer_b,
        departure_time:  document.getElementById('departure-time').value || null,
        max_detour_minutes: 15,
      };

      try {
        const res  = await fetch('/api/v2/search', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
        const data = await res.json();
        hideLoading();
        if (data.session_id) {
          state.session_id = data.session_id;
          renderResults(data);
        } else {
          showError('搜索出错：' + (data.message || data.error || JSON.stringify(data)));
        }
      } catch(e) {
        hideLoading();
        showError('网络错误，请检查后端服务是否启动：' + e.message);
      }
    });

    // ══════════════════════════════════════════════
    // 渲染结果
    // ══════════════════════════════════════════════

    /** 顺路标签文字 + 颜色 */
    const BADGE_MAP = {
      both: { text: '✅ 双方顺路', cls: 'both' },
      one:  { text: '⚠️ 单方顺路', cls: 'one'  },
      none: { text: '❌ 均不顺路', cls: 'none' },
    };

    /** 错误提示卡片 */
    function showError(msg) {
      const sec = document.getElementById('results-section');
      document.getElementById('results-list').innerHTML =
        `<div class="k-card" style="border-color:var(--k-red); background:#fff5f5;">
           <p style="font-family:'Bangers',cursive; font-size:18px; color:var(--k-red);">⚠️ 出了点问题</p>
           <p style="font-size:14px; margin-top:6px;">${msg}</p>
         </div>`;
      document.getElementById('midpoint-section').style.display = 'none';
      document.getElementById('recalc-panel').style.display = 'none';
      sec.classList.add('show');
    }

    /** 空结果提示 */
    function renderEmpty() {
      document.getElementById('results-title').textContent = '🔍 搜索结果';
      document.getElementById('results-list').innerHTML =
        `<div class="k-card" style="background:var(--k-yellow);">
           <p style="font-family:'Bangers',cursive; font-size:20px;">未找到相关餐厅</p>
           <p style="font-size:14px; margin-top:8px; line-height:1.6;">
             可以试试：<br>
             · 修改关键词（如"火锅"改"川菜"）<br>
             · 检查城市填写是否正确<br>
             · 放宽搜索条件，不限定菜系
           </p>
         </div>`;
      document.getElementById('midpoint-section').style.display = 'none';
      document.getElementById('recalc-panel').style.display = 'none';
      document.getElementById('results-section').classList.add('show');
    }

    /** 单张结果卡片 HTML */
    function renderCard(poi, index) {
      const badge = BADGE_MAP[poi.detour_label] || BADGE_MAP.none;
      const rating = poi.rating ? `⭐ ${poi.rating}` : '暂无评分';
      const costVal = poi.cost && poi.cost.toString().trim() && parseFloat(poi.cost) > 0 ? poi.cost : null;
      const cost   = costVal ? `💰 人均 ¥${costVal}` : '';
      const aMin   = poi.a_route?.detour_min != null ? `${poi.a_route.detour_min.toFixed(0)} 分钟` : '—';
      const bMin   = poi.b_route?.detour_min != null ? `${poi.b_route.detour_min.toFixed(0)} 分钟` : '—';
      const aTot   = poi.a_route?.total_min   != null ? `全程 ${poi.a_route.total_min.toFixed(0)} 分钟` : '';
      const bTot   = poi.b_route?.total_min   != null ? `全程 ${poi.b_route.total_min.toFixed(0)} 分钟` : '';

      return `
        <div class="k-card result-card" data-index="${index}" role="button" tabindex="0" aria-pressed="false" aria-label="选择餐厅：${poi.name}">
          <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:8px;">
            <div class="result-name">${index + 1}. ${poi.name}</div>
            <span class="detour-badge ${badge.cls}" style="white-space:nowrap; flex-shrink:0;">${badge.text}</span>
          </div>
          <div class="result-address">${poi.address || ''}</div>
          <div class="result-meta">
            <span>${rating}</span>
            ${cost ? `<span>${cost}</span>` : ''}
          </div>
          <div class="route-row">
            <div class="route-col">
              <strong>A 绕路</strong><br>
              <span style="font-size:18px; font-family:'Bangers',cursive;">${aMin}</span>
              ${aTot ? `<br><small style="color:#777;">${aTot}</small>` : ''}
            </div>
            <div class="route-col" style="text-align:right;">
              <strong>B 绕路</strong><br>
              <span style="font-size:18px; font-family:'Bangers',cursive;">${bMin}</span>
              ${bTot ? `<br><small style="color:#777;">${bTot}</small>` : ''}
            </div>
          </div>
        </div>`;
    }

    /** 主渲染函数 */
    function renderResults(data) {
      const results  = data.results  || [];
      const fallback = data.fallback_results || [];
      const total    = data.total    || 0;

      // 空结果
      if (total === 0 && results.length === 0 && fallback.length === 0) {
        renderEmpty();
        updateMapMarkers(data);
        return;
      }

      // ── 顺路推荐列表
      const listEl = document.getElementById('results-list');
      if (results.length > 0) {
        document.getElementById('results-title').textContent =
          `🎯 顺路推荐（共 ${results.length} 家）`;
        listEl.innerHTML = results.map((poi, i) => renderCard(poi, i)).join('');
      } else {
        document.getElementById('results-title').textContent = '🎯 顺路推荐';
        listEl.innerHTML = '<p style="color:#888; font-size:14px; padding:8px 0;">本次无顺路结果，已显示中间点推荐</p>';
      }

      // ── summary 推荐语条幅
      if (data.summary) {
        listEl.insertAdjacentHTML('afterbegin',
          `<div class="k-card" style="background:var(--k-blue); color:var(--k-white); margin-bottom:16px; border-color:var(--k-ink);">
             <p style="font-family:'Comic Neue',cursive; font-size:15px; line-height:1.7; margin:0;">
               🤖 ${data.summary}
             </p>
           </div>`
        );
      }

      // ── fallback 中间点推荐
      const midSec  = document.getElementById('midpoint-section');
      const midList = document.getElementById('midpoint-list');
      if (fallback.length > 0) {
        midList.innerHTML = fallback.map((poi, i) => renderCard(poi, i)).join('');
        midSec.style.display = 'block';
        // fallback 卡片的事件绑定（偏移 results.length）
        midList.querySelectorAll('.result-card').forEach((el, i) => {
          el.addEventListener('click', () => onCardClick(fallback[i], results.length + i));
          el.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              onCardClick(fallback[i], results.length + i);
            }
          });
        });
      } else {
        midSec.style.display = 'none';
      }

      // ── 卡片点击与键盘事件
      listEl.querySelectorAll('.result-card').forEach((el, i) => {
        el.addEventListener('click', () => onCardClick(results[i], i));
        el.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            onCardClick(results[i], i);
          }
        });
      });

      // ── 显示路线重算面板
      document.getElementById('recalc-panel').style.display = 'block';

      document.getElementById('results-section').classList.add('show');

      // ── 更新地图标记
      updateMapMarkers(data);
    }

    // ══════════════════════════════════════════════
    // 地图标记
    // ══════════════════════════════════════════════

    /** 清除旧标记 */
    function clearMarkers() {
      state.markers.forEach(m => state.map && m.setMap(null));
      state.markers = [];
    }

    /** 更新地图标记：搜索中心 + 候选餐厅 */
    function updateMapMarkers(data) {
      if (!state.map) return;
      clearMarkers();

      const allPois = [...(data.results || []), ...(data.fallback_results || [])];
      if (allPois.length === 0 && !data.center) return;

      // 搜索中心标记（星形）
      if (data.center) {
        const centerMarker = new AMap.Marker({
          position: [data.center.lng, data.center.lat],
          content: `<div style="
            width:36px; height:36px; line-height:36px; text-align:center;
            font-size:22px; background:var(--k-yellow,#FFE600);
            border:3px solid #111; border-radius:50%;
            box-shadow:3px 3px 0 #111;">⭐</div>`,
          offset: new AMap.Pixel(-18, -18),
          title: '搜索中心',
        });
        centerMarker.setMap(state.map);
        state.markers.push(centerMarker);
      }

      // 候选餐厅标记（数字编号）
      allPois.forEach((poi, i) => {
        if (!poi.location) return;
        const isResult  = i < (data.results || []).length;
        const bg = isResult ? '#111' : '#666';
        const marker = new AMap.Marker({
          position: [poi.location.lng, poi.location.lat],
          content: `<div style="
            width:28px; height:28px; line-height:28px; text-align:center;
            font-size:13px; font-weight:bold; color:#fff;
            background:${bg}; border:2px solid #fff;
            border-radius:50%; box-shadow:2px 2px 0 #111;
            font-family:'Bangers',cursive;">${i + 1}</div>`,
          offset: new AMap.Pixel(-14, -14),
          title: poi.name,
        });
        // 点击标记打开信息窗
        marker.on('click', () => openInfoWindow(poi, i));
        marker.setMap(state.map);
        state.markers.push(marker);
      });

      // 调整视野
      if (allPois.length > 0) {
        const lnglats = allPois
          .filter(p => p.location)
          .map(p => [p.location.lng, p.location.lat]);
        if (data.center) lnglats.push([data.center.lng, data.center.lat]);
        state.map.setFitView(state.markers, false, [40, 40, 40, 40]);
      }
    }

    /** 打开信息窗 */
    function openInfoWindow(poi, index) {
      if (!state.map || !state.infoWindow) return;
      const aMin = poi.a_route?.detour_min != null ? `${poi.a_route.detour_min.toFixed(0)}分钟` : '—';
      const bMin = poi.b_route?.detour_min != null ? `${poi.b_route.detour_min.toFixed(0)}分钟` : '—';
      const badge = BADGE_MAP[poi.detour_label] || BADGE_MAP.none;
      state.infoWindow.setContent(
        `<div style="font-family:'Comic Neue',cursive; padding:8px 12px; min-width:160px; background:#fff; border:3px solid #111; box-shadow:4px 4px 0 #111;">
           <div style="font-family:'Bangers',cursive; font-size:18px; margin-bottom:4px;">${index + 1}. ${poi.name}</div>
           <div style="font-size:12px; color:#555; margin-bottom:6px;">${poi.address || ''}</div>
           <div style="font-size:13px;">A 绕路 <b>${aMin}</b> · B 绕路 <b>${bMin}</b></div>
           <div style="margin-top:4px; font-size:12px;">${badge.text}</div>
         </div>`
      );
      state.infoWindow.open(state.map, [poi.location.lng, poi.location.lat]);
    }

    /** 卡片点击 → 地图联动 */
    function onCardClick(poi, index) {
      // 卡片高亮
      document.querySelectorAll('.result-card').forEach(el => {
        el.classList.remove('selected');
        el.setAttribute('aria-pressed', 'false');
      });
      const cards = document.querySelectorAll('.result-card');
      if (cards[index]) {
        cards[index].classList.add('selected');
        cards[index].setAttribute('aria-pressed', 'true');
      }

      if (!state.map || !poi.location) return;
      state.map.panTo([poi.location.lng, poi.location.lat]);
      openInfoWindow(poi, index);
    }

    // ══════════════════════════════════════════════
    // 路线重算
    // ══════════════════════════════════════════════
    document.getElementById('recalc-btn').addEventListener('click', async () => {
      if (!state.session_id) return;
      showLoading();
      try {
        const res  = await fetch('/api/v2/routes', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ session_id: state.session_id, prefer_a: state.prefer_a, prefer_b: state.prefer_b })
        });
        const data = await res.json();
        hideLoading();
        if (data.session_id || data.results) {
          renderResults(data);
        } else {
          showError('重算失败：' + (data.message || data.error || JSON.stringify(data)));
        }
      } catch(e) {
        hideLoading();
        showError('重算网络错误：' + e.message);
      }
    });

    // ══════════════════════════════════════════════
    // 拖拽分界线
    // ══════════════════════════════════════════════
    const divider   = document.getElementById('divider');
    const panelLeft = document.getElementById('panel-left');
    let isDragging  = false;

    divider.addEventListener('mousedown', () => { isDragging = true; document.body.style.cursor = 'col-resize'; });
    document.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const newW = e.clientX;
      if (newW > 280 && newW < 700) panelLeft.style.width = newW + 'px';
    });
    document.addEventListener('mouseup', () => { isDragging = false; document.body.style.cursor = ''; });

    // ══════════════════════════════════════════════
    // 启动
    // ══════════════════════════════════════════════
    initMap();
  </script>
</body>
</html>
